# Build, format and test gate. The repository's conventions are enforced here and
# by RepositoryConventionsTests, so a green pipeline means both the code and the
# formatting rules hold.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Majors are pinned, not floated: '@v7' moves within v7 only, so a major
      # release cannot change the pipeline under us. Both actions moved to
      # Node 24 in their v5 (setup-dotnet) and v5 (checkout) releases, so these
      # versions silence the runner's Node-20 deprecation notice.
      - uses: actions/checkout@v7

      # global-json-file makes the SDK version come from global.json (9.0.100),
      # so the pipeline and a developer machine agree. From v5.4 this action also
      # validates the rollForward declaration, which global.json sets to
      # latestFeature.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Verify formatting conventions
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"